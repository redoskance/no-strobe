name: CI

on:
  push:
    branches: [main, test-for-android]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One run per push; an old run of the same branch is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The platform-free core: the flicker measurement, the controller, the restorer.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # The Kotlin side that does not need a camera: the frame rate the flicker allows, and the
  # exposure that fits the frame.
  kotlin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle :app:testDebugUnitTest
        working-directory: platform/android

  # The Apps: Android APK (with native library for both ABIs) and desktop post-processing tool.
  apps:
    needs: [core, kotlin-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships the Android SDK (ANDROID_HOME) with cmdline-tools/latest,
      # platform 34, build-tools and several NDK versions under $ANDROID_HOME/ndk.
      # Take the newest NDK the image already has, or fall back to ANDROID_NDK_ROOT.
      - name: Pick the NDK the runner has
        run: |
          if [ -d "$ANDROID_HOME/ndk" ] && [ -n "$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            v=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -1)
            ndk_dir="$ANDROID_HOME/ndk/$v"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            ndk_dir="$ANDROID_NDK_ROOT"
          else
            v=$(yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
                | grep -oE '^ndk;[0-9]+\.[0-9]+\.[0-9]+' | tail -1 | cut -d';' -f2)
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$v"
            ndk_dir="$ANDROID_HOME/ndk/$v"
          fi
          echo "ANDROID_NDK_HOME=$ndk_dir" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ndk_dir" >> $GITHUB_ENV
          echo "NDK path: $ndk_dir"
      - run: cargo install cargo-ndk --locked
      - name: Build libns_ffi.so for both ABIs
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o platform/android/app/src/main/jniLibs build -p ns-ffi --release --features android
      - name: Build desktop post-processing tool
        run: cargo build --release -p ns-post
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      # The release key lives in the repository SECRETS (a base64 keystore and its passwords), never in the
      # repository. Without them the APK is signed with the runner's throwaway debug key.
      - name: Release key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.NOSTROBE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nostrobe-release.keystore"
            echo "NOSTROBE_KEYSTORE_PATH=$RUNNER_TEMP/nostrobe-release.keystore" >> "$GITHUB_ENV"
            echo "release key configured"
          else
            echo "no release key configured: the APK is signed with a throwaway debug key"
          fi
      - name: Build the APK
        env:
          NOSTROBE_STORE_PASSWORD: ${{ secrets.NOSTROBE_STORE_PASSWORD }}
          NOSTROBE_KEY_ALIAS: ${{ secrets.NOSTROBE_KEY_ALIAS }}
          NOSTROBE_KEY_PASSWORD: ${{ secrets.NOSTROBE_KEY_PASSWORD }}
        run: gradle :app:assembleDebug
        working-directory: platform/android
      - name: Publish the nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          files: |
            platform/android/app/build/outputs/apk/debug/app-debug.apk
            target/release/no-strobe-post
      # Tag releases are created by the tag-release job (one draft), not here.
      - name: Keep the APK for the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: platform/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Keep the desktop tool for the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: no-strobe-post
          path: target/release/no-strobe-post

  # Mockup CI for iOS App: runs selection simulation tests, generates Xcode project, and builds Simulator .app
  ios:
    needs: [core, kotlin-tests, apps]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run iOS frame selection simulation
        run: |
          cd platform/ios/app/check
          swiftc ../AntiStrobe/StrobeAnalyzer.swift main.swift -o /tmp/check
          /tmp/check
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode Project
        run: |
          cd platform/ios/app
          xcodegen generate
      - name: Build Mockup iOS App (Simulator)
        run: |
          cd platform/ios/app
          xcodebuild -project AntiStrobe.xcodeproj \
            -scheme AntiStrobe \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package Mockup iOS App
        run: |
          mkdir -p build/ios
          APP_DIR=$(find ~/Library/Developer/Xcode/DerivedData -name "AntiStrobe.app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            ditto -c -k --sequesterRsrc "$APP_DIR" build/ios/AntiStrobe-Simulator.app.zip
            echo "Packaged AntiStrobe.app to build/ios/AntiStrobe-Simulator.app.zip"
          else
            echo "AntiStrobe.app not found, bundling app sources"
            zip -r build/ios/AntiStrobe-Simulator.app.zip platform/ios/app
          fi
      - name: Upload Mockup iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-mockup-app
          path: build/ios/AntiStrobe-Simulator.app.zip
      - name: Publish to Nightly Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          files: build/ios/AntiStrobe-Simulator.app.zip

  # The only job that creates a tag release. It waits for the APK and the iOS zip, and creates
  # the release as a DRAFT: check the assets, then publish it by hand.
  tag-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apps, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create the draft tag release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: false
          draft: true
          files: |
            dist/app-debug-apk/app-debug.apk
            dist/no-strobe-post/no-strobe-post
            dist/ios-mockup-app/AntiStrobe-Simulator.app.zip
