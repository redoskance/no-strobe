name: CI

on:
  push:
    branches: [main, test-for-android]
  pull_request:

# One run per push; an old run of the same branch is cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The platform-free core: the flicker measurement, the controller, the restorer.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # The Kotlin side that does not need a camera: the frame rate the flicker allows, and the
  # exposure that fits the frame.
  kotlin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle :app:testDebugUnitTest
        working-directory: platform/android

  # The Apps: Android APK (with native library for both ABIs) and desktop post-processing tool.
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships the Android SDK (ANDROID_HOME) with cmdline-tools/latest,
      # platform 34, build-tools and several NDK versions under $ANDROID_HOME/ndk.
      # Take the newest NDK the image already has, or fall back to ANDROID_NDK_ROOT.
      - name: Pick the NDK the runner has
        run: |
          if [ -d "$ANDROID_HOME/ndk" ] && [ -n "$(ls -1 "$ANDROID_HOME/ndk" 2>/dev/null)" ]; then
            v=$(ls -1 "$ANDROID_HOME/ndk" | sort -V | tail -1)
            ndk_dir="$ANDROID_HOME/ndk/$v"
          elif [ -n "$ANDROID_NDK_ROOT" ] && [ -d "$ANDROID_NDK_ROOT" ]; then
            ndk_dir="$ANDROID_NDK_ROOT"
          else
            v=$(yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
                | grep -oE '^ndk;[0-9]+\.[0-9]+\.[0-9]+' | tail -1 | cut -d';' -f2)
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$v"
            ndk_dir="$ANDROID_HOME/ndk/$v"
          fi
          echo "ANDROID_NDK_HOME=$ndk_dir" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ndk_dir" >> $GITHUB_ENV
          echo "NDK path: $ndk_dir"
      - run: cargo install cargo-ndk --locked
      - name: Build libns_ffi.so for both ABIs
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -o platform/android/app/src/main/jniLibs build -p ns-ffi --release --features android
      - name: Build desktop post-processing tool
        run: cargo build --release -p ns-post
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build the APK
        run: gradle :app:assembleDebug
        working-directory: platform/android
      - name: Publish the nightly release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          files: |
            platform/android/app/build/outputs/apk/debug/app-debug.apk
            target/release/no-strobe-post
