[package]
name = "ns-ffi"
version = "0.2.0"
edition = "2021"

[lib]
name = "ns_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
jni = { version = "0.21", optional = true }
ns-core = { path = "../ns-core" }
ash = { version = "0.38", default-features = false, features = ["loaded", "std"], optional = true }

[features]
android = ["jni"]
jni = ["dep:jni"]
vulkan = ["dep:ash"]
